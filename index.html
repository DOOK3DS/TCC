<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apresentação TCC Saúde e Beleza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Paleta: lavanda e grafite, inspirada nos slides */
:root {
  --ink: #5f5f78;
  --muted: #8a8aa3;
  --lilac: #b4a6e6;
  --lilac-deep: #7c6bc4;
  --bg: #f7f6fb;
  --card: #ffffff;
  --line: #e4e1f0;
  --ok: #2f8f6b;
  --warn: #b7791f;
  --bad: #c0392b;
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Lato", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid var(--lilac-deep);
  outline-offset: 2px;
}

/* Barra superior com cronômetro */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(120deg, #b4a6e6, #a9c4f0);
  color: #fff;
  padding: 12px 16px;
  box-shadow: 0 2px 10px rgba(80, 70, 140, 0.18);
}
.topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.clock {
  font-family: var(--display);
  font-size: 2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  line-height: 1;
}
.clock-label { font-size: 0.8rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.08em; }
.status {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.92);
  color: var(--ink);
}
.status.low { color: var(--warn); }
.status.ok { color: var(--ok); }
.status.high { color: var(--bad); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 0;
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 0.95rem;
  min-height: 44px;
  background: #fff;
  color: var(--lilac-deep);
}
.btn.alt { background: rgba(255, 255, 255, 0.22); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: default; }
.bar {
  margin-top: 10px;
  height: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.3);
  position: relative;
  overflow: hidden;
}
.bar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  background: #fff;
  border-radius: 999px;
  transition: width 0.4s ease;
}
.bar-note { font-size: 0.78rem; margin-top: 4px; opacity: 0.95; }

main {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px 60px;
}

/* Painel da sua parte */
.mine-panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 5px solid var(--lilac-deep);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
.mine-panel h2 {
  font-family: var(--display);
  font-size: 1.1rem;
  margin: 0 0 6px;
  color: var(--lilac-deep);
}
.mine-stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 0.95rem;
}
.mine-stats strong { font-variant-numeric: tabular-nums; color: var(--ink); }

/* Navegação de slides */
.dots {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  margin-bottom: 16px;
}
.dot {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  border-radius: 10px;
  min-height: 40px;
  font-weight: 700;
  font-size: 0.9rem;
}
.dot.mine { border-color: var(--lilac); color: var(--lilac-deep); }
.dot.current { background: var(--lilac-deep); color: #fff; border-color: var(--lilac-deep); }
.dot.done { color: var(--ink); }

/* Cartão do slide */
.slide-card {
  background: var(--card);
  border-radius: 18px;
  border: 1px solid var(--line);
  box-shadow: 0 6px 22px rgba(90, 80, 150, 0.08);
  overflow: hidden;
}
.slide-head {
  background: linear-gradient(120deg, #b4a6e6 0%, #a9c4f0 100%);
  color: #fff;
  padding: 22px 20px 20px;
}
.slide-num {
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.95;
}
.slide-head h1 {
  font-family: var(--display);
  font-size: 1.7rem;
  line-height: 1.2;
  margin: 6px 0 0;
  text-wrap: balance;
}
.tag {
  display: inline-block;
  margin-top: 10px;
  background: #fff;
  color: var(--lilac-deep);
  font-weight: 700;
  font-size: 0.78rem;
  padding: 3px 10px;
  border-radius: 999px;
}
.slide-body { padding: 18px 20px 8px; }
.slide-body ul {
  margin: 0 0 6px;
  padding-left: 20px;
}
.slide-body li { margin-bottom: 6px; }
.slide-body .lead { margin: 0 0 10px; font-size: 1.05rem; color: var(--ink); }

.timer-box {
  margin: 14px 20px 0;
  padding: 12px 14px;
  border-radius: 12px;
  background: #f3f1fb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.timer-box .big {
  font-family: var(--display);
  font-size: 1.6rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--lilac-deep);
}
.timer-box.over .big { color: var(--bad); }
.timer-box small { display: block; color: var(--muted); font-size: 0.82rem; }
.slide-bar {
  margin: 10px 20px 0;
  height: 6px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.slide-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--lilac-deep);
  transition: width 0.4s linear;
}
.timer-box.over ~ .slide-bar .slide-bar-fill { background: var(--bad); }

details.script {
  margin: 16px 20px 0;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
details.script summary {
  cursor: pointer;
  font-weight: 700;
  color: var(--lilac-deep);
  min-height: 44px;
  display: flex;
  align-items: center;
}
details.script p {
  margin: 8px 0 0;
  max-width: 65ch;
  text-wrap: pretty;
}
.sources {
  margin: 14px 20px 0;
  padding: 12px 14px;
  background: #fafafd;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 0.85rem;
  color: var(--muted);
}
.sources strong { color: var(--ink); }
.sources ul { margin: 6px 0 0; padding-left: 18px; }
.slide-foot { padding: 18px 20px 20px; }

.nav {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.nav .btn { flex: 1; background: var(--lilac-deep); color: #fff; }
.nav .btn.ghost { background: var(--card); color: var(--lilac-deep); border: 1px solid var(--line); }

.footnote {
  margin-top: 18px;
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
}

@media (min-width: 700px) {
  .slide-head h1 { font-size: 2.1rem; }
  .clock { font-size: 2.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  .bar-fill, .slide-bar-fill { transition: none; }
}
/* Botões que abrem o roteiro e as perguntas */
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 20px 0; }
.open-btn {
  flex: 1 1 200px;
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  min-height: 48px;
  font-weight: 700;
  font-size: 0.98rem;
  background: var(--lilac-deep);
  color: #fff;
}
.open-btn[aria-expanded="true"] {
  background: #fff;
  color: var(--lilac-deep);
  box-shadow: inset 0 0 0 2px var(--lilac-deep);
}
.panel {
  margin: 12px 20px 0;
  padding: 14px 16px;
  border-radius: 12px;
  background: #fafafd;
  border: 1px solid var(--line);
}
.panel[hidden] { display: none; }
.panel-title { font-weight: 700; color: var(--lilac-deep); margin: 0 0 8px; font-size: 0.95rem; }
.panel p { margin: 0 0 10px; max-width: 65ch; text-wrap: pretty; }
.panel p:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div>
      <div class="clock-label">Tempo total</div>
      <div class="clock" id="totalClock" aria-live="off">00:00</div>
      <span class="status" id="totalStatus">Sua parte: 2 a 3 min</span>
    </div>
    <div class="controls">
      <button class="btn" id="startBtn" type="button">Iniciar</button>
      <button class="btn alt" id="resetBtn" type="button">Zerar</button>
    </div>
  </div>
  <div class="bar" aria-hidden="true"><div class="bar-fill" id="totalBar"></div></div>
  <div class="bar-note" id="totalNote">Sua parte: 2:00 a 3:00</div>
</header>

<main>
  <section class="mine-panel" aria-label="Sua parte">
    <h2>Sua apresentação: slides 7 e 8</h2>
    <div class="mine-stats">
      <span>Tempo sugerido: <strong id="mineTarget">17:00</strong></span>
      <span>Já falou: <strong id="mineSpent">00:00</strong></span>
      <span id="mineLeft">Restam: <strong>04:30</strong></span>
    </div>
  </section>

  <nav class="dots" id="dots" aria-label="Slides"></nav>

  <article class="slide-card" id="slideCard" aria-live="polite"></article>

  <div class="nav">
    <button class="btn ghost" id="prevBtn" type="button">Anterior</button>
    <button class="btn" id="nextBtn" type="button">Próximo</button>
  </div>

  <p class="footnote">Use as setas do teclado ou deslize o dedo para trocar de slide. O cronômetro conta só enquanto estiver iniciado.</p>
</main>

<script src="js/slides1.js"></script>
<script src="js/slides2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
